<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danny's Diner — Tables &amp; Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3EAD8; --paper:#FBF6EC; --red:#B3372C; --red-dark:#8C2A22;
  --charcoal:#262220; --mustard:#E8A93B; --line:rgba(38,34,32,.14);
  --ok:#4C7A4C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#211D1A; --paper:#2A2521; --charcoal:#F3EAD8; --line:rgba(243,234,216,.16);
  }
}
:root[data-theme="dark"]{ --cream:#211D1A; --paper:#2A2521; --charcoal:#F3EAD8; --line:rgba(243,234,216,.16); }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; min-height:100%; background:var(--cream); color:var(--charcoal);
  font-family:'Karla',sans-serif; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.headline{font-family:'Anton',sans-serif; letter-spacing:.02em; font-weight:400; margin:0;}
header{
  background:var(--red); color:var(--cream); padding:18px 20px calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  border-bottom:4px solid var(--red-dark);
}
header h1{font-size:26px;}
header .sub{font-size:12px; opacity:.85; margin-top:2px;}
nav{display:flex; gap:8px;}
nav button{
  border:2px solid var(--cream); background:transparent; color:var(--cream);
  font-family:'Karla',sans-serif; font-weight:700; font-size:13px; padding:8px 14px;
  border-radius:6px; cursor:pointer;
}
nav button.active{background:var(--mustard); border-color:var(--mustard); color:var(--charcoal);}
main{padding:20px; max-width:960px; margin:0 auto;}
.view{display:none;} .view.active{display:block;}

/* Mesas grid */
.tables-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px;}
.table-card{
  background:var(--paper); border:2px solid var(--line); border-radius:10px; padding:14px 10px;
  text-align:center; cursor:pointer; transition:transform .12s ease;
}
.table-card:active{transform:scale(.96);}
.table-card.occupied{border-color:var(--red); background:linear-gradient(180deg,var(--paper),rgba(179,55,44,.08));}
.table-card .num{font-family:'Anton',sans-serif; font-size:22px;}
.table-card .amt{font-size:13px; color:var(--red); font-weight:700; margin-top:4px;}
.table-card .empty{font-size:12px; opacity:.55; margin-top:4px;}

/* Order panel (modal) */
.overlay{
  position:fixed; inset:0; background:rgba(38,34,32,.55); display:none; align-items:flex-end;
  justify-content:center; z-index:50;
}
.overlay.open{display:flex;}
.panel{
  background:var(--cream); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
}
.panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.panel-head h2{font-size:22px;}
.close-x{background:none; border:none; font-size:22px; cursor:pointer; color:var(--charcoal);}
.cat-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; opacity:.6; margin:14px 0 6px;}
.item-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
.item-row .info{flex:1; min-width:0;}
.item-row .name{font-weight:700; font-size:14px;}
.item-row .meta{font-size:12px; opacity:.65;}
.qty-btn{
  width:32px; height:32px; border-radius:8px; border:2px solid var(--red); background:var(--paper);
  color:var(--red); font-size:18px; font-weight:700; cursor:pointer; line-height:1;
}
.qty-btn:disabled{opacity:.3; cursor:not-allowed;}
.qty-btn.add{background:var(--red); color:var(--cream);}
.qty-num{min-width:20px; text-align:center; font-weight:700;}

.order-summary{background:var(--paper); border-radius:10px; padding:12px 14px; margin-top:14px; border:2px solid var(--line);}
.order-line{display:flex; justify-content:space-between; font-size:14px; padding:3px 0;}
.order-total{display:flex; justify-content:space-between; font-family:'Anton',sans-serif; font-size:20px; margin-top:8px; padding-top:8px; border-top:2px dashed var(--line);}
.charge-btn{
  width:100%; margin-top:14px; padding:14px; border:none; border-radius:10px; background:var(--ok);
  color:#fff; font-family:'Anton',sans-serif; font-size:18px; letter-spacing:.03em; cursor:pointer;
}
.charge-btn:disabled{background:#999; cursor:not-allowed;}

/* Menu/stock view */
.mgmt-item{display:flex; align-items:center; gap:10px; background:var(--paper); border:2px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px;}
.mgmt-item .info{flex:1; min-width:0;}
.mgmt-item .name{font-weight:700;}
.mgmt-item .meta{font-size:12px; opacity:.65;}
.mgmt-item input[type=number]{width:60px; padding:6px; border-radius:6px; border:2px solid var(--line); background:var(--cream); color:var(--charcoal); font-weight:700; text-align:center;}
.mgmt-item .low{color:var(--red); font-weight:700;}
.del-btn{background:none; border:none; color:var(--red); font-size:18px; cursor:pointer;}
.add-form{display:grid; grid-template-columns:1fr 90px 90px auto; gap:8px; margin-top:16px; align-items:end;}
.add-form label{font-size:11px; font-weight:700; text-transform:uppercase; opacity:.65; display:block; margin-bottom:3px;}
.add-form input,.add-form select{width:100%; padding:8px; border-radius:6px; border:2px solid var(--line); background:var(--paper); color:var(--charcoal);}
.add-form button{padding:9px 14px; border:none; border-radius:6px; background:var(--red); color:var(--cream); font-weight:700; cursor:pointer;}

.toast{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(20px); background:var(--charcoal); color:var(--cream); padding:12px 20px; border-radius:8px; font-weight:700; opacity:0; transition:.25s; z-index:60; pointer-events:none;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.section-title{margin-bottom:14px;}
.hist-item{background:var(--paper); border:2px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;}
.hist-head{display:flex; justify-content:space-between; align-items:baseline;}
.hist-head .table{font-family:'Anton',sans-serif; font-size:16px;}
.hist-head .total{font-weight:700; color:var(--red);}
.hist-time{font-size:11px; opacity:.6; margin-bottom:4px;}
.hist-items{font-size:12px; opacity:.75; line-height:1.5;}
</style>
</head>
<body>

<header>
  <div>
    <h1>DANNY'S DINER</h1>
    <div class="sub">Tables · Stock · Sales</div>
  </div>
  <nav>
    <button id="navMesas" class="active">Tables</button>
    <button id="navHistory">History</button>
    <button id="navMenu">Menu &amp; Stock</button>
  </nav>
</header>

<main>
  <div id="viewMesas" class="view active">
    <h2 class="section-title">Tables</h2>
    <div id="tablesGrid" class="tables-grid"></div>
  </div>

  <div id="viewHistory" class="view">
    <h2 class="section-title">Closed tables</h2>
    <div id="historyTotal" style="font-weight:700; margin-bottom:12px;"></div>
    <div id="historyList"></div>
  </div>

  <div id="viewMenu" class="view">
    <h2 class="section-title">Food</h2>
    <div id="foodList"></div>
    <h2 class="section-title" style="margin-top:22px;">Drinks</h2>
    <div id="drinkList"></div>

    <h3 style="margin-top:22px; font-size:16px;">Add product</h3>
    <div class="add-form">
      <div><label>Name</label><input id="newName" placeholder="E.g. Milkshake"></div>
      <div><label>Price €</label><input id="newPrice" type="number" step="0.5" min="0"></div>
      <div><label>Stock</label><input id="newStock" type="number" min="0" value="0"></div>
      <div><label>Type</label><select id="newCat"><option value="comida">Food</option><option value="bebida">Drink</option></select></div>
      <div></div><div></div><div></div>
      <button id="addItemBtn" style="grid-column:1/2;">Add</button>
    </div>
  </div>
</main>

<div id="overlay" class="overlay">
  <div class="panel">
    <div class="panel-head">
      <h2 id="panelTitle">Table</h2>
      <button class="close-x" id="closePanel">✕</button>
    </div>
    <div class="cat-label">Food</div>
    <div id="panelFood"></div>
    <div class="cat-label">Drinks</div>
    <div id="panelDrink"></div>
    <div class="order-summary">
      <div id="orderLines"></div>
      <div class="order-total"><span>Total</span><span id="orderTotal">€0</span></div>
    </div>
    <button class="charge-btn" id="chargeBtn">CHARGE TABLE</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// --- Firebase: pegá acá el "firebaseConfig" que te da la consola de Firebase ---
const firebaseConfig = {
  apiKey: "AIzaSyCUg47QDW0FHdNl2Bf7T_tCyTotwoL0x6k",
  authDomain: "dannys-2cee7.firebaseapp.com",
  databaseURL: "https://dannys-2cee7-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dannys-2cee7",
  storageBucket: "dannys-2cee7.firebasestorage.app",
  messagingSenderId: "326553057108",
  appId: "1:326553057108:web:7aff49475fc5608a0cfac1"
};
let db = null, firebaseReady = false;
try{
  if(firebaseConfig.apiKey !== "PASTE_HERE"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database().ref('dannysDinerState');
    firebaseReady = true;
  }
}catch(e){ console.warn('Firebase not configured, using local storage only.', e); }

const STORAGE_KEY = 'dannys-diner-data-v1';
const NUM_TABLES = 8;

function seed(){
  return {
    items: [
      {id:'f1', name:'Amerikanischer Burger', category:'comida', price:9, desc:'huevo, cebolla, hongos, cheddar', stock:20},
      {id:'f2', name:'Pommes', category:'comida', price:5, stock:30},
      {id:'f3', name:'Hähnchen Schnitzel', category:'comida', price:14.5, stock:18},
      {id:'f3b', name:'Schnitzel — Extra hongos', category:'comida', price:0.5, stock:18},
      {id:'f4', name:'Rind Steak (schwarz)', category:'comida', price:15, stock:15},
      {id:'f5', name:'Spaghetti Bolognese', category:'comida', price:12.5, stock:20},
      {id:'d1', name:'Espresso', category:'bebida', price:3.5, desc:'Hot', stock:40},
      {id:'d2', name:'Kaffee Crema', category:'bebida', price:3.5, desc:'Hot', stock:40},
      {id:'d3', name:'Cappuccino', category:'bebida', price:4, desc:'Hot', stock:40},
      {id:'d4', name:'Latte Macchiato', category:'bebida', price:4, desc:'Hot', stock:40},
      {id:'d5', name:'Tee', category:'bebida', price:3, desc:'Hot', stock:40},
      {id:'d6', name:'Coca-Cola', category:'bebida', price:2.5, desc:'Soft drink', stock:40},
      {id:'d7', name:'Sprite', category:'bebida', price:2.5, desc:'Soft drink', stock:40},
      {id:'d8', name:'Fanta', category:'bebida', price:2.5, desc:'Soft drink', stock:40},
      {id:'d9', name:'Apfelsaft', category:'bebida', price:3, desc:'Soft drink', stock:30},
      {id:'d10', name:'Bier', category:'bebida', price:3.5, desc:'Alcoholic', stock:60},
      {id:'d11', name:'Campari', category:'bebida', price:8, desc:'Alcoholic', stock:20},
      {id:'d12', name:'Aperol Spritz', category:'bebida', price:8, desc:'Alcoholic', stock:20},
      {id:'d13', name:'Cuba Libre', category:'bebida', price:8, desc:'Alcoholic', stock:20},
      {id:'d14', name:'Gin Tonic', category:'bebida', price:8, desc:'Alcoholic', stock:20},
      {id:'d15', name:'Moscow Mule', category:'bebida', price:8, desc:'Alcoholic', stock:20},
      {id:'d16', name:'Wein', category:'bebida', price:7, desc:'Alcoholic', stock:20},
      {id:'d17', name:'Whisky', category:'bebida', price:0, desc:'Alcoholic · price missing', stock:20},
    ],
    tables: {}
  };
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return seed();
    return JSON.parse(raw);
  }catch(e){ return seed(); }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  if(firebaseReady && db) db.set(state);
}
function renderAll(){
  renderTables();
  if(document.getElementById('overlay').classList.contains('open')) renderPanel();
  if(document.getElementById('viewMenu').classList.contains('active')) renderMenuLists();
  if(document.getElementById('viewHistory').classList.contains('active')) renderHistory();
}

let state = load();
let activeTable = null;

function fmt(n){ return '€' + n.toFixed(2).replace(/\.00$/,''); }
function getItem(id){ return state.items.find(i=>i.id===id); }
function tk(t){ return 't'+t; }
function tableOrder(t){ return state.tables[tk(t)] || []; }
function tableTotal(t){
  return tableOrder(t).reduce((s,l)=>{ const it=getItem(l.id); return s + (it?it.price*l.qty:0); },0);
}
function stockRemaining(id){
  const item = getItem(id);
  let reserved = 0;
  Object.values(state.tables).forEach(order=>{
    const l = order.find(x=>x.id===id);
    if(l) reserved += l.qty;
  });
  return item.stock - reserved;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---- Nav ----
document.getElementById('navMesas').onclick = ()=>switchView('Mesas');
document.getElementById('navHistory').onclick = ()=>switchView('History');
document.getElementById('navMenu').onclick = ()=>switchView('Menu');
function switchView(v){
  document.getElementById('viewMesas').classList.toggle('active', v==='Mesas');
  document.getElementById('viewHistory').classList.toggle('active', v==='History');
  document.getElementById('viewMenu').classList.toggle('active', v==='Menu');
  document.getElementById('navMesas').classList.toggle('active', v==='Mesas');
  document.getElementById('navHistory').classList.toggle('active', v==='History');
  document.getElementById('navMenu').classList.toggle('active', v==='Menu');
  if(v==='Menu') renderMenuLists();
  if(v==='History') renderHistory();
}

// ---- Tables grid ----
function renderTables(){
  const grid = document.getElementById('tablesGrid');
  grid.innerHTML = '';
  for(let i=1;i<=NUM_TABLES;i++){
    const order = tableOrder(i);
    const total = tableTotal(i);
    const div = document.createElement('div');
    div.className = 'table-card' + (order.length?' occupied':'');
    div.innerHTML = `<div class="num">Table ${i}</div>` +
      (order.length ? `<div class="amt">${fmt(total)}</div>` : `<div class="empty">Free</div>`);
    div.onclick = ()=>openTable(i);
    grid.appendChild(div);
  }
}

// ---- Order panel ----
function openTable(t){
  activeTable = t;
  document.getElementById('panelTitle').textContent = 'Table ' + t;
  renderPanel();
  document.getElementById('overlay').classList.add('open');
}
document.getElementById('closePanel').onclick = ()=>{
  document.getElementById('overlay').classList.remove('open');
  renderTables();
};

function renderPanel(){
  renderPanelCat('comida', document.getElementById('panelFood'));
  renderPanelCat('bebida', document.getElementById('panelDrink'));
  renderOrderSummary();
}

function renderPanelCat(cat, container){
  container.innerHTML = '';
  state.items.filter(i=>i.category===cat).forEach(item=>{
    const line = tableOrder(activeTable).find(l=>l.id===item.id);
    const qty = line ? line.qty : 0;
    const avail = stockRemaining(item.id);
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <div class="info"><div class="name">${item.name}</div><div class="meta">${fmt(item.price)}${item.desc?' · '+item.desc:''} · ${avail + qty} left</div></div>
      <button class="qty-btn" ${qty===0?'disabled':''} data-act="minus" data-id="${item.id}">−</button>
      <div class="qty-num">${qty}</div>
      <button class="qty-btn add" ${avail<=0?'disabled':''} data-act="plus" data-id="${item.id}">+</button>
    `;
    container.appendChild(row);
  });
}

document.getElementById('panelFood').addEventListener('click', handleQtyClick);
document.getElementById('panelDrink').addEventListener('click', handleQtyClick);
function handleQtyClick(e){
  const btn = e.target.closest('.qty-btn');
  if(!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  if(!state.tables[tk(activeTable)]) state.tables[tk(activeTable)] = [];
  const order = state.tables[tk(activeTable)];
  let line = order.find(l=>l.id===id);
  if(act==='plus'){
    if(stockRemaining(id) <= 0) return;
    if(line) line.qty++; else order.push({id, qty:1});
  } else {
    if(line){ line.qty--; if(line.qty<=0) state.tables[tk(activeTable)] = order.filter(l=>l.id!==id); }
  }
  save();
  renderPanel();
}

function renderOrderSummary(){
  const order = tableOrder(activeTable);
  const linesDiv = document.getElementById('orderLines');
  linesDiv.innerHTML = order.length ? '' : '<div style="opacity:.55; font-size:13px;">No items yet</div>';
  order.forEach(l=>{
    const it = getItem(l.id);
    const row = document.createElement('div');
    row.className = 'order-line';
    row.innerHTML = `<span>${l.qty}× ${it.name}</span><span>${fmt(it.price*l.qty)}</span>`;
    linesDiv.appendChild(row);
  });
  document.getElementById('orderTotal').textContent = fmt(tableTotal(activeTable));
  document.getElementById('chargeBtn').disabled = order.length===0;
}

document.getElementById('chargeBtn').onclick = ()=>{
  const order = tableOrder(activeTable);
  if(!order.length) return;
  const total = tableTotal(activeTable);
  const itemsSnapshot = order.map(l=>({name:getItem(l.id).name, qty:l.qty, price:getItem(l.id).price}));
  order.forEach(l=>{
    const it = getItem(l.id);
    it.stock = Math.max(0, it.stock - l.qty);
  });
  delete state.tables[tk(activeTable)];
  if(!state.salesLog) state.salesLog = [];
  state.salesLog.unshift({id: Date.now()+'-'+activeTable, table: activeTable, total, items: itemsSnapshot, closedAt: new Date().toISOString()});
  save();
  document.getElementById('overlay').classList.remove('open');
  renderTables();
  toast('Table ' + activeTable + ' charged — ' + fmt(total));
};

function renderHistory(){
  const log = state.salesLog || [];
  const listEl = document.getElementById('historyList');
  const totalEl = document.getElementById('historyTotal');
  if(!log.length){
    listEl.innerHTML = '<div style="opacity:.55; font-size:13px;">No closed tables yet</div>';
    totalEl.textContent = '';
    return;
  }
  const sum = log.reduce((s,e)=>s+e.total,0);
  totalEl.textContent = 'Total recorded: ' + fmt(sum) + ' · ' + log.length + ' table(s)';
  listEl.innerHTML = '';
  log.forEach(e=>{
    const d = new Date(e.closedAt);
    const timeStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const itemsStr = e.items.map(i=>`${i.qty}× ${i.name}`).join(', ');
    const div = document.createElement('div');
    div.className = 'hist-item';
    div.innerHTML = `
      <div class="hist-time">${timeStr}</div>
      <div class="hist-head"><span class="table">Table ${e.table}</span><span class="total">${fmt(e.total)}</span></div>
      <div class="hist-items">${itemsStr}</div>
    `;
    listEl.appendChild(div);
  });
}

// ---- Menu & stock management ----
function renderMenuLists(){
  renderMgmt('comida', document.getElementById('foodList'));
  renderMgmt('bebida', document.getElementById('drinkList'));
}
function renderMgmt(cat, container){
  container.innerHTML = '';
  state.items.filter(i=>i.category===cat).forEach(item=>{
    const low = item.stock <= 3;
    const row = document.createElement('div');
    row.className = 'mgmt-item';
    row.innerHTML = `
      <div class="info"><div class="name">${item.name}</div><div class="meta">${fmt(item.price)}${item.desc?' · '+item.desc:''}${low?' · <span class="low">low stock</span>':''}</div></div>
      <div><label style="font-size:10px; opacity:.6; display:block;">Stock</label><input type="number" min="0" value="${item.stock}" data-id="${item.id}" class="stockInput"></div>
      <button class="del-btn" data-id="${item.id}" title="Delete">🗑</button>
    `;
    container.appendChild(row);
  });
}
document.getElementById('foodList').addEventListener('input', handleStockInput);
document.getElementById('drinkList').addEventListener('input', handleStockInput);
function handleStockInput(e){
  if(!e.target.classList.contains('stockInput')) return;
  const it = getItem(e.target.dataset.id);
  it.stock = Math.max(0, parseInt(e.target.value)||0);
  save();
  renderMenuLists();
}
document.getElementById('foodList').addEventListener('click', handleDel);
document.getElementById('drinkList').addEventListener('click', handleDel);
function handleDel(e){
  const btn = e.target.closest('.del-btn');
  if(!btn) return;
  state.items = state.items.filter(i=>i.id!==btn.dataset.id);
  Object.keys(state.tables).forEach(t=>{
    state.tables[tk(t)] = (state.tables[tk(t)]||[]).filter(l=>l.id!==btn.dataset.id);
    if(!state.tables[tk(t)].length) delete state.tables[tk(t)];
  });
  save();
  renderMenuLists();
}

document.getElementById('addItemBtn').onclick = ()=>{
  const name = document.getElementById('newName').value.trim();
  const price = parseFloat(document.getElementById('newPrice').value);
  const stock = parseInt(document.getElementById('newStock').value)||0;
  const cat = document.getElementById('newCat').value;
  if(!name || isNaN(price)){ toast('Fill in name and price'); return; }
  const id = cat[0] + Date.now();
  state.items.push({id, name, category:cat, price, stock});
  save();
  document.getElementById('newName').value='';
  document.getElementById('newPrice').value='';
  document.getElementById('newStock').value='0';
  renderMenuLists();
  toast('Product added');
};

renderTables();
if(firebaseReady && db){
  db.on('value', snap=>{
    const remote = snap.val();
    if(remote){ state = remote; } else { db.set(state); }
    renderAll();
  });
}
</script>
</body>
