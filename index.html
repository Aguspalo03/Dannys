<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Danny's Diner — POS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#F3EAD8;
  --paper:#FBF6EC;
  --red:#B3372C;
  --red-dark:#8C2A22;
  --charcoal:#262220;
  --mustard:#E8A93B;
  --line:rgba(38,34,32,.14);
  --ok:#4C7A4C;
  --blue:#476B8C;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cream:#211D1A;
    --paper:#2A2521;
    --charcoal:#F3EAD8;
    --line:rgba(243,234,216,.16);
  }
}

:root[data-theme="dark"]{
  --cream:#211D1A;
  --paper:#2A2521;
  --charcoal:#F3EAD8;
  --line:rgba(243,234,216,.16);
}

*{
  box-sizing:border-box;
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  height:100%;
}

body{
  margin:0;
  min-height:100%;
  background:var(--cream);
  color:var(--charcoal);
  font-family:'Karla',sans-serif;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3,.headline{
  font-family:'Anton',sans-serif;
  letter-spacing:.02em;
  font-weight:400;
  margin:0;
}

button{
  font-family:'Karla',sans-serif;
}

header{
  background:var(--red);
  color:var(--cream);
  padding:18px 20px calc(14px + env(safe-area-inset-top,0px));
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  border-bottom:4px solid var(--red-dark);
}

header h1{
  font-size:26px;
}

header .sub{
  font-size:12px;
  opacity:.85;
  margin-top:2px;
}

nav{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

nav button{
  border:2px solid var(--cream);
  background:transparent;
  color:var(--cream);
  font-weight:700;
  font-size:12px;
  padding:8px 11px;
  border-radius:6px;
  cursor:pointer;
}

nav button.active{
  background:var(--mustard);
  border-color:var(--mustard);
  color:var(--charcoal);
}

main{
  padding:20px;
  max-width:1100px;
  margin:0 auto;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

.section-title{
  margin-bottom:14px;
}

/* TABLES */

.tables-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;
}

.table-card{
  background:var(--paper);
  border:2px solid var(--line);
  border-radius:10px;
  padding:16px 10px;
  text-align:center;
  cursor:pointer;
  transition:transform .12s ease, border-color .12s ease;
}

.table-card:active{
  transform:scale(.96);
}

.table-card.occupied{
  border-color:var(--red);
  background:linear-gradient(
    180deg,
    var(--paper),
    rgba(179,55,44,.08)
  );
}

.table-card .num{
  font-family:'Anton',sans-serif;
  font-size:22px;
}

.table-card .amt{
  font-size:14px;
  color:var(--red);
  font-weight:700;
  margin-top:4px;
}

.table-card .items-count{
  font-size:11px;
  opacity:.65;
  margin-top:3px;
}

.table-card .empty{
  font-size:12px;
  opacity:.55;
  margin-top:4px;
}

/* DASHBOARD */

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat-card{
  background:var(--paper);
  border:2px solid var(--line);
  border-radius:10px;
  padding:15px;
}

.stat-card .label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.06em;
  opacity:.6;
  font-weight:700;
}

.stat-card .value{
  font-family:'Anton',sans-serif;
  font-size:28px;
  margin-top:4px;
}

.dashboard-columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.dashboard-box{
  background:var(--paper);
  border:2px solid var(--line);
  border-radius:10px;
  padding:15px;
}

.dashboard-box h3{
  font-size:18px;
  margin-bottom:12px;
}

.metric-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

.metric-row:last-child{
  border-bottom:0;
}

.bar-wrap{
  background:rgba(128,128,128,.15);
  border-radius:5px;
  height:8px;
  margin-top:5px;
  overflow:hidden;
}

.bar{
  background:var(--red);
  height:100%;
  border-radius:5px;
}

/* ORDER PANEL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(38,34,32,.55);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
}

.overlay.open{
  display:flex;
}

.panel{
  background:var(--cream);
  width:100%;
  max-width:600px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:16px 16px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.panel-head h2{
  font-size:22px;
}

.close-x{
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
  color:var(--charcoal);
}

.search-box{
  margin:10px 0 14px;
}

.search-box input{
  width:100%;
  padding:11px 12px;
  border-radius:8px;
  border:2px solid var(--line);
  background:var(--paper);
  color:var(--charcoal);
  font-size:14px;
}

.cat-label{
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.06em;
  opacity:.6;
  margin:14px 0 6px;
}

.item-row{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}

.item-row .info{
  flex:1;
  min-width:0;
}

.item-row .name{
  font-weight:700;
  font-size:14px;
}

.item-row .meta{
  font-size:11px;
  opacity:.65;
  margin-top:2px;
}

.item-row.no-stock{
  opacity:.45;
}

.qty-btn{
  width:32px;
  height:32px;
  border-radius:8px;
  border:2px solid var(--red);
  background:var(--paper);
  color:var(--red);
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  line-height:1;
}

.qty-btn:disabled{
  opacity:.3;
  cursor:not-allowed;
}

.qty-btn.add{
  background:var(--red);
  color:var(--cream);
}

.qty-num{
  min-width:20px;
  text-align:center;
  font-weight:700;
}

.order-summary{
  background:var(--paper);
  border-radius:10px;
  padding:12px 14px;
  margin-top:14px;
  border:2px solid var(--line);
}

.order-line{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:14px;
  padding:6px 0;
  border-bottom:1px solid var(--line);
}

.order-line-name{
  flex:1;
  min-width:0;
}

.order-line-price{
  min-width:60px;
  text-align:right;
  font-weight:700;
}

.mini-qty{
  width:27px;
  height:27px;
  border:1px solid var(--red);
  background:transparent;
  color:var(--red);
  border-radius:6px;
  font-weight:700;
  cursor:pointer;
}

.order-total{
  display:flex;
  justify-content:space-between;
  font-family:'Anton',sans-serif;
  font-size:20px;
  margin-top:8px;
  padding-top:8px;
  border-top:2px dashed var(--line);
}

.order-actions{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:8px;
  margin-top:10px;
}

.clear-order-btn{
  padding:13px;
  border:2px solid var(--red);
  border-radius:10px;
  background:transparent;
  color:var(--red);
  font-weight:700;
  cursor:pointer;
}

.charge-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:var(--ok);
  color:#fff;
  font-family:'Anton',sans-serif;
  font-size:18px;
  letter-spacing:.03em;
  cursor:pointer;
}

.charge-btn:disabled{
  background:#999;
  cursor:not-allowed;
}

/* MENU */

.mgmt-item{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--paper);
  border:2px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:8px;
}

.mgmt-item .info{
  flex:1;
  min-width:0;
}

.mgmt-item .name{
  font-weight:700;
}

.mgmt-item .meta{
  font-size:12px;
  opacity:.65;
}

.mgmt-item input{
  width:80px;
  padding:6px;
  border-radius:6px;
  border:2px solid var(--line);
  background:var(--cream);
  color:var(--charcoal);
  font-weight:700;
  text-align:center;
}

.mgmt-item .product-name{
  width:150px;
  text-align:left;
  font-weight:700;
}

.mgmt-item .product-price{
  width:70px;
}

.low{
  color:var(--red);
  font-weight:700;
}

.del-btn,
.edit-btn{
  background:none;
  border:none;
  font-size:18px;
  cursor:pointer;
}

.del-btn{
  color:var(--red);
}

.edit-btn{
  color:var(--blue);
}

.save-edit-btn{
  background:var(--ok);
  color:#fff;
  border:0;
  border-radius:6px;
  padding:7px 10px;
  font-weight:700;
  cursor:pointer;
}

.cancel-edit-btn{
  background:none;
  border:0;
  cursor:pointer;
  font-size:17px;
}

.add-form{
  display:grid;
  grid-template-columns:1fr 90px 90px 100px;
  gap:8px;
  margin-top:16px;
  align-items:end;
}

.add-form label{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  opacity:.65;
  display:block;
  margin-bottom:3px;
}

.add-form input,
.add-form select{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:2px solid var(--line);
  background:var(--paper);
  color:var(--charcoal);
}

.add-form button{
  padding:9px 14px;
  border:none;
  border-radius:6px;
  background:var(--red);
  color:var(--cream);
  font-weight:700;
  cursor:pointer;
}

/* HISTORY */

.history-toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.danger-btn{
  padding:9px 12px;
  border:0;
  border-radius:7px;
  background:var(--red);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.hist-item{
  background:var(--paper);
  border:2px solid var(--line);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:10px;
}

.hist-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
}

.hist-head .table{
  font-family:'Anton',sans-serif;
  font-size:16px;
}

.hist-head .total{
  font-weight:700;
  color:var(--red);
}

.hist-time{
  font-size:11px;
  opacity:.6;
  margin-bottom:4px;
}

.hist-items{
  font-size:12px;
  opacity:.75;
  line-height:1.5;
}

.hist-actions{
  margin-top:8px;
  display:flex;
  justify-content:flex-end;
}

.delete-sale-btn{
  border:0;
  background:none;
  color:var(--red);
  font-weight:700;
  cursor:pointer;
  font-size:12px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--charcoal);
  color:var(--cream);
  padding:12px 20px;
  border-radius:8px;
  font-weight:700;
  opacity:0;
  transition:.25s;
  z-index:60;
  pointer-events:none;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.warning{
  color:var(--red);
  font-weight:700;
}

@media(max-width:750px){
  .dashboard-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .dashboard-columns{
    grid-template-columns:1fr;
  }

  .add-form{
    grid-template-columns:1fr 1fr;
  }

  .add-form button{
    grid-column:1/-1;
  }

  .mgmt-item{
    flex-wrap:wrap;
  }

  .mgmt-item .product-name{
    width:100%;
  }
}

@media(max-width:480px){
  header{
    padding-left:14px;
    padding-right:14px;
  }

  main{
    padding:14px;
  }

  nav{
    width:100%;
  }

  nav button{
    flex:1;
    padding:8px 5px;
  }

  .tables-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>

<body>

<header>
  <div>
    <h1>DANNY'S DINER</h1>
    <div class="sub">Tables · Orders · Stock · Sales · v5</div>
  </div>

  <nav>
    <button id="navMesas" class="active">Tables</button>

    <button id="navMenu">Menu</button>
  </nav>
</header>

<main>

  <!-- TABLES -->

  <div id="viewMesas" class="view active">
    <h2 class="section-title">Tables</h2>
    <div id="tablesGrid" class="tables-grid"></div>
  </div>


  <!-- DASHBOARD -->

  <div id="viewDashboard" class="view">

    <h2 class="section-title">Sales Dashboard</h2>

    <div class="dashboard-grid">

      <div class="stat-card">
        <div class="label">Total sales</div>
        <div class="value" id="dashTotal">€0</div>
      </div>

      <div class="stat-card">
        <div class="label">Today</div>
        <div class="value" id="dashToday">€0</div>
      </div>

      <div class="stat-card">
        <div class="label">Tables closed</div>
        <div class="value" id="dashTables">0</div>
      </div>

      <div class="stat-card">
        <div class="label">Average ticket</div>
        <div class="value" id="dashAverage">€0</div>
      </div>

    </div>

    <div class="dashboard-columns">

      <div class="dashboard-box">
        <h3>Sales breakdown</h3>

        <div class="metric-row">
          <span>Food</span>
          <strong id="dashFood">€0</strong>
        </div>

        <div class="metric-row">
          <span>Drinks</span>
          <strong id="dashDrinks">€0</strong>
        </div>

        <div class="metric-row">
          <span>Items sold</span>
          <strong id="dashItems">0</strong>
        </div>
      </div>


      <div class="dashboard-box">
        <h3>Top products</h3>
        <div id="topProducts"></div>
      </div>

    </div>

  </div>


  <!-- HISTORY -->

  <div id="viewHistory" class="view">

    <h2 class="section-title">Closed tables</h2>

    <div class="history-toolbar">
      <button id="deleteHistoryBtn" class="danger-btn">
        Delete all history
      </button>
    </div>

    <div id="historyTotal" style="font-weight:700;margin-bottom:12px;"></div>

    <div id="historyList"></div>

  </div>


  <!-- MENU -->

  <div id="viewMenu" class="view">

    <h2 class="section-title">Food</h2>
    <div id="foodList"></div>

    <h2 class="section-title" style="margin-top:22px;">Drinks</h2>
    <div id="drinkList"></div>

    <h3 style="margin-top:22px;font-size:16px;">Add product</h3>

    <div class="add-form">

      <div>
        <label>Name</label>
        <input id="newName" placeholder="E.g. Milkshake">
      </div>

      <div>
        <label>Price €</label>
        <input id="newPrice" type="number" step="0.5" min="0">
      </div>

      <div>
        <label>Stock</label>
        <input id="newStock" type="number" min="0" value="0">
      </div>

      <div>
        <label>Type</label>
        <select id="newCat">
          <option value="comida">Food</option>
          <option value="bebida">Drink</option>
        </select>
      </div>

      <button id="addItemBtn">
        Add product
      </button>

    </div>

  </div>

</main>


<!-- ORDER PANEL -->

<div id="overlay" class="overlay">

  <div class="panel">

    <div class="panel-head">
      <h2 id="panelTitle">Table</h2>
      <button class="close-x" id="closePanel">✕</button>
    </div>

    <div class="search-box">
      <input
        id="productSearch"
        type="search"
        placeholder="Search product..."
      >
    </div>

    <div class="cat-label">Food</div>
    <div id="panelFood"></div>

    <div class="cat-label">Drinks</div>
    <div id="panelDrink"></div>

    <div class="order-summary">

      <div id="orderLines"></div>

      <div class="order-total">
        <span>Total</span>
        <span id="orderTotal">€0</span>
      </div>

    </div>

    <div class="order-actions">

      <button id="clearOrderBtn" class="clear-order-btn">
        Clear
      </button>

      <button class="charge-btn" id="chargeBtn">
        CHARGE TABLE
      </button>

    </div>

  </div>

</div>


<div id="toast" class="toast"></div>

<div
  id="errBox"
  style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:#8C2A22;
    color:#fff;
    padding:8px 12px;
    font-size:12px;
    z-index:99;
  "
></div>

/* =========================================================
   NORMALIZE
========================================================= */

function normalize(s){

  if(!s || typeof s !== 'object')
    return seed();

  if(!Array.isArray(s.items) || !s.items.length)
    s.items = seed().items;

  if(!s.tables || typeof s.tables !== 'object'){

    s.tables = {};

  }else if(Array.isArray(s.tables)){

    const obj = {};

    s.tables.forEach((v,idx)=>{

      if(v && Array.isArray(v) && v.length)
        obj['t'+idx] = v;

    });

    s.tables = obj;

  }

  if(!Array.isArray(s.salesLog))
    s.salesLog = [];

  return s;

}


/* =========================================================
   LOAD / SAVE
========================================================= */

function load(){

  try{

    const raw =
      localStorage.getItem(STORAGE_KEY);

    if(!raw)
      return seed();

    return normalize(
      JSON.parse(raw)
    );

  }catch(e){

    return seed();

  }

}


function save(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );

  }catch(e){}

  if(firebaseReady && db){

    db.set(state);

  }

}


/* =========================================================
   HELPERS
========================================================= */

function fmt(n){

  return '€' +
    Number(n || 0)
      .toFixed(2)
      .replace(/\.00$/,'');

}


function getItem(id){

  return state.items.find(
    i => i.id === id
  );

}


function tk(t){

  return 't' + t;

}


function tableOrder(t){

  return (
    state.tables?.[tk(t)] || []
  );

}


function tableTotal(t){

  return tableOrder(t)
    .reduce((sum,line)=>{

      const item =
        getItem(line.id);

      return sum +
        (item
          ? item.price * line.qty
          : 0);

    },0);

}


function stockRemaining(id){

  const item =
    getItem(id);

  if(!item)
    return 0;

  let reserved = 0;

  Object.values(
    state.tables || {}
  ).forEach(order=>{

    const line =
      order.find(
        x => x.id === id
      );

    if(line)
      reserved += line.qty;

  });

  return item.stock - reserved;

}


function totalItemsInTable(t){

  return tableOrder(t)
    .reduce(
      (sum,line)=>sum+line.qty,
      0
    );

}

          }

        >

function handleQtyClick(e){

  const btn =
    e.target.closest('.qty-btn');

  if(!btn)
    return;

  const id =
    btn.dataset.id;

  const act =
    btn.dataset.act;


  if(
    !state.tables[
      tk(activeTable)
    ]
  ){

    state.tables[
      tk(activeTable)
    ] = [];

  }


  const order =
    state.tables[
      tk(activeTable)
    ];


  let line =
    order.find(
      l => l.id === id
    );


  if(act === 'plus'){

    if(stockRemaining(id) <= 0)
      return;

    if(line){

      line.qty++;

    }else{

      order.push({
        id,
        qty:1
      });

    }

  }else{

    if(line){

      line.qty--;

      if(line.qty <= 0){

        state.tables[
          tk(activeTable)
        ] =
          order.filter(
            l => l.id !== id
          );

      }

    }

  }


  save();

  renderPanel();

  renderTables();

}

document
  .getElementById('chargeBtn')
  .onclick = ()=>{

    const order =
      tableOrder(activeTable);

    if(!order.length)
      return;


    const invalidPrice =
      order.some(line=>{

        const item =
          getItem(line.id);

        return !item ||
          Number(item.price) <= 0;

      });


    if(invalidPrice){

      toast(
        'Fix product prices first'
      );

      return;

    }


    const total =
      tableTotal(activeTable);


    const itemsSnapshot =
      order.map(line=>{

        const item =
          getItem(line.id);

        return {

          name:item.name,

          qty:line.qty,

          price:item.price,

          category:item.category

        };

      });


    order.forEach(line=>{

      const item =
        getItem(line.id);

      if(item){

        item.stock =
          Math.max(
            0,
            item.stock - line.qty
          );

      }

    });


    delete state.tables[
      tk(activeTable)
    ];


    if(!state.salesLog)
      state.salesLog = [];


    state.salesLog.unshift({

      id:
        Date.now() +
        '-' +
        activeTable,

      table:activeTable,

      total,

      items:itemsSnapshot,

      closedAt:
        new Date().toISOString()

    });


    save();


    document
      .getElementById('overlay')
      .classList.remove('open');


    renderTables();

    toast(
      'Table ' +
      activeTable +
      ' charged — ' +
      fmt(total)
    );

  };

/* =========================================================
   DASHBOARD
========================================================= */

function renderDashboard(){

  const log =
    state.salesLog || [];


  const total =
    log.reduce(
      (s,e)=>
        s + Number(e.total || 0),
      0
    );


  const todayKey =
    new Date()
      .toLocaleDateString();


  const todaySales =
    log
      .filter(e=>{

        return new Date(
          e.closedAt
        ).toLocaleDateString()
          === todayKey;

      })
      .reduce(
        (s,e)=>
          s + Number(e.total || 0),
        0
      );


  const average =
    log.length
      ? total / log.length
      : 0;


  let food = 0;
  let drinks = 0;
  let itemCount = 0;


  const productStats = {};


  log.forEach(sale=>{

    (sale.items || [])
      .forEach(item=>{

        const value =
          Number(item.price || 0) *
          Number(item.qty || 0);


        itemCount +=
          Number(item.qty || 0);


        if(
          item.category ===
          'comida'
        ){

          food += value;

        }else{

          drinks += value;

        }


        if(
          !productStats[item.name]
        ){

          productStats[item.name] = {
            qty:0,
            revenue:0
          };

        }


        productStats[item.name].qty +=
          Number(item.qty || 0);

        productStats[item.name].revenue +=
          value;

      });

  }


  document.getElementById(
    'dashTotal'
  ).textContent =
    fmt(total);


  document.getElementById(
    'dashToday'
  ).textContent =
    fmt(todaySales);


  document.getElementById(
    'dashTables'
  ).textContent =
    log.length;


  document.getElementById(
    'dashAverage'
  ).textContent =
    fmt(average);


  document.getElementById(
    'dashFood'
  ).textContent =
    fmt(food);


  document.getElementById(
    'dashDrinks'
  ).textContent =
    fmt(drinks);


  document.getElementById(
    'dashItems'
  ).textContent =
    itemCount;


  const top =
    Object.entries(
      productStats
    )
    .sort(
      (a,b)=>
        b[1].qty -
        a[1].qty
    )
    .slice(0,8);


  const topEl =
    document.getElementById(
      'topProducts'
    );


  if(!top.length){

    topEl.innerHTML =
      `
      <div style="
        opacity:.55;
        font-size:13px;
      ">
        No sales yet
      </div>
      `;

    return;

  }


  const maxQty =
    top[0][1].qty;


  topEl.innerHTML =
    top.map(([name,data])=>{

      const percentage =
        maxQty
          ? (data.qty / maxQty) * 100
          : 0;


      return `

        <div
          style="
            margin-bottom:12px;
          "
        >

          <div class="metric-row">

            <span>
              ${name}
            </span>

            <strong>
              ${data.qty}×
              ·
              ${fmt(data.revenue)}
            </strong>

          </div>

          <div class="bar-wrap">

            <div
              class="bar"
              style="
                width:${percentage}%;
              "
            ></div>

          </div>

        </div>

      `;

    }).join('');

}

  ];


  let row = null;


  containers.forEach(container=>{

    const buttons =
      container.querySelectorAll(
        '.edit-btn'
      );


    buttons.forEach(btn=>{

      if(btn.dataset.id === id)
        row = btn.closest(
          '.mgmt-item'
        );

    });

  });


  if(!row)
    return;


  row.innerHTML = `

    <div class="info">

      <input
        class="product-name"
        id="editName-${id}"
        value="${escapeHtml(item.name)}"
      >

      <input
        style="
          width:100%;
          margin-top:5px;
          text-align:left;
        "
        id="editDesc-${id}"
        value="${escapeHtml(item.desc || '')}"
        placeholder="Description"
      >

    </div>

    <div>

      <label style="
        font-size:10px;
        opacity:.6;
        display:block;
      ">
        Price
      </label>

      <input
        class="product-price"
        id="editPrice-${id}"
        type="number"
        step="0.5"
        min="0"
        value="${item.price}"
      >

    </div>

    <div>

      <label style="
        font-size:10px;
        opacity:.6;
        display:block;
      ">
        Stock
      </label>

      <input
        type="number"
        min="0"
        id="editStock-${id}"
        value="${item.stock}"
      >

    </div>

    <button
      class="save-edit-btn"
      data-save-id="${id}"
    >
      Save
    </button>

    <button
      class="cancel-edit-btn"
      data-cancel-id="${id}"
    >
      ✕
    </button>

  `;

}


/* HTML ESCAPE */

function escapeHtml(str){

  return String(str || '')
    .replace(
      /[&<>"']/g,
      m => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[m])
    );

}


/* MENU CLICK */

document
  .getElementById('foodList')
  .addEventListener(
    'click',
    handleMenuClick
  );

document
  .getElementById('drinkList')
  .addEventListener(
    'click',
    handleMenuClick
  );


function handleMenuClick(e){

  const editBtn =
    e.target.closest(
      '.edit-btn'
    );


  if(editBtn){

    startEditProduct(
      editBtn.dataset.id
    );

    return;

  }


  const saveBtn =
    e.target.closest(
      '.save-edit-btn'
    );


  if(saveBtn){

    saveProduct(
      saveBtn.dataset.saveId
    );

    return;

  }


  const cancelBtn =
    e.target.closest(
      '.cancel-edit-btn'
    );


  if(cancelBtn){

    renderMenuLists();

    return;

  }


  const delBtn =
    e.target.closest(
      '.del-btn'
    );


  if(delBtn){

    deleteProduct(
      delBtn.dataset.id
    );

  }

}


/* SAVE PRODUCT */

function saveProduct(id){

  const item =
    getItem(id);

  if(!item)
    return;


  const name =
    document.getElementById(
      'editName-' + id
    ).value.trim();


  const desc =
    document.getElementById(
      'editDesc-' + id
    ).value.trim();


  const price =
    parseFloat(
      document.getElementById(
        'editPrice-' + id
      ).value
    );


  const stock =
    parseInt(
      document.getElementById(
        'editStock-' + id
      ).value
    );


  if(!name){

    toast(
      'Product name is required'
    );

    return;

  }


  if(
    isNaN(price) ||
    price < 0
  ){

    toast(
      'Invalid price'
    );

    return;

  }


  item.name = name;

  item.desc = desc;

  item.price = price;

  item.stock =
    isNaN(stock)
      ? 0
      : Math.max(0,stock);


  save();

  renderMenuLists();

  if(
    document
      .getElementById(
        'overlay'
      )
      .classList
      .contains('open')
  ){

    renderPanel();

  }


  toast(
    'Product updated'
  );

}


/* STOCK INPUT */

function handleStockInput(e){

  if(
    !e.target.classList
      .contains('stockInput')
  )
    return;


  const item =
    getItem(
      e.target.dataset.id
    );


  if(!item)
    return;


  item.stock =
    Math.max(
      0,
      parseInt(
        e.target.value
      ) || 0
    );


  save();

  renderMenuLists();

}


document
  .getElementById('foodList')
  .addEventListener(
    'input',
    handleStockInput
  );

document
  .getElementById('drinkList')
  .addEventListener(
    'input',
    handleStockInput
  );


/* DELETE PRODUCT */

function deleteProduct(id){

  const item =
    getItem(id);

  if(!item)
    return;


  if(
    !confirm(
      `Delete "${item.name}"?`
    )
  )
    return;


  state.items =
    state.items.filter(
      i => i.id !== id
    );


  Object.keys(
    state.tables || {}
  ).forEach(t=>{

    state.tables[t] =
      (
        state.tables[t] || []
      ).filter(
        line => line.id !== id
      );


    if(
      !state.tables[t].length
    ){

      delete state.tables[t];

    }

  });


  save();

  renderMenuLists();

  renderTables();

  toast(
    'Product deleted'
  );

}


/* =========================================================
   ADD PRODUCT
========================================================= */

document
  .getElementById('addItemBtn')
  .onclick = ()=>{

    const name =
      document
        .getElementById(
          'newName'
        )
        .value
        .trim();


    const price =
      parseFloat(
        document
          .getElementById(
            'newPrice'
          )
          .value
      );


    const stock =
      parseInt(
        document
          .getElementById(
            'newStock'
          )
          .value
      ) || 0;


    const cat =
      document
        .getElementById(
          'newCat'
        )
        .value;


    if(!name || isNaN(price)){

      toast(
        'Fill in name and price'
      );

      return;

    }


    const id =
      cat[0] +
      Date.now();


    state.items.push({

      id,

      name,

      category:cat,

      price,

      stock

    });


    save();


    document
      .getElementById(
        'newName'
      )
      .value = '';


    document
      .getElementById(
        'newPrice'
      )
      .value = '';


    document
      .getElementById(
        'newStock'
      )
      .value = '0';


    renderMenuLists();

    toast(
      'Product added'
    );

  };


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll(){

  renderTables();

  if(
    document
      .getElementById('overlay')
      .classList
      .contains('open')
  ){

    renderPanel();

  }


  if(
    document
      .getElementById('viewMenu')
      .classList
      .contains('active')
  ){

    renderMenuLists();

  }


  if(
    document
      .getElementById('viewHistory')
      .classList
      .contains('active')
  ){

    renderHistory();

  }


  if(
    document
      .getElementById('viewDashboard')
      .classList
      .contains('active')
  ){

    renderDashboard();

  }

}


/* =========================================================
   ERROR HANDLER
========================================================= */

window.addEventListener(
  'error',
  e=>{

    const box =
      document.getElementById(
        'errBox'
      );

    if(box){

      box.style.display =
        'block';

      box.textContent =
        'Error: ' +
        e.message;

    }

  }
);


/* =========================================================
   INIT
========================================================= */

let state = load();

renderTables();


/* =========================================================
   FIREBASE REALTIME SYNC
========================================================= */

if(firebaseReady && db){

  db.on(
    'value',
    snap=>{

      try{

        const remote =
          snap.val();


        if(remote){

          state =
            normalize(remote);

        }else{

          db.set(state);

        }


        renderAll();

      }catch(e){

        console.error(
          'Sync error',
          e
        );

      }

    }
  );

}

</script>
