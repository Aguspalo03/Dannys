<title>Danny's Diner — Tables &amp; Stock</title>

<style>
:root{--cream:#F3EAD8;--paper:#FBF6EC;--red:#B3372C;--red-dark:#8C2A22;--charcoal:#262220;--mustard:#E8A93B;--line:rgba(38,34,32,.14);--ok:#4C7A4C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--cream:#211D1A;--paper:#2A2521;--charcoal:#F3EAD8;--line:rgba(243,234,216,.16);}}
:root[data-theme="dark"]{--cream:#211D1A;--paper:#2A2521;--charcoal:#F3EAD8;--line:rgba(243,234,216,.16);}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
body{margin:0;min-height:100%;background:var(--cream);color:var(--charcoal);font-family:'Karla',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.headline{font-family:'Anton',sans-serif;letter-spacing:.02em;font-weight:400;margin:0;}
header{background:var(--red);color:var(--cream);padding:18px 20px calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--red-dark);}
header h1{font-size:26px;}
header .sub{font-size:12px;opacity:.85;margin-top:2px;}
nav{display:flex;gap:8px;}
nav button{border:2px solid var(--cream);background:transparent;color:var(--cream);font-family:'Karla',sans-serif;font-weight:700;font-size:13px;padding:8px 14px;border-radius:6px;cursor:pointer;}
nav button.active{background:var(--mustard);border-color:var(--mustard);color:var(--charcoal);}
main{padding:20px;max-width:960px;margin:0 auto;}
.view{display:none;}.view.active{display:block;}
.tables-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;}
.table-card{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;transition:transform .12s ease;}
.table-card:active{transform:scale(.96);}
.table-card.occupied{border-color:var(--red);background:linear-gradient(180deg,var(--paper),rgba(179,55,44,.08));}
.table-card .num{font-family:'Anton',sans-serif;font-size:22px;}
.table-card .amt{font-size:13px;color:var(--red);font-weight:700;margin-top:4px;}
.table-card .empty{font-size:12px;opacity:.55;margin-top:4px;}
.overlay{position:fixed;inset:0;background:rgba(38,34,32,.55);display:none;align-items:flex-end;justify-content:center;z-index:50;}
.overlay.open{display:flex;}
.panel{background:var(--cream);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.panel-head h2{font-size:22px;}
.close-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--charcoal);}
.cat-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin:14px 0 6px;}
.item-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.item-row .info{flex:1;min-width:0;}
.item-row .name{font-weight:700;font-size:14px;}
.item-row .meta{font-size:12px;opacity:.65;}
.qty-btn{width:32px;height:32px;border-radius:8px;border:2px solid var(--red);background:var(--paper);color:var(--red);font-size:18px;font-weight:700;cursor:pointer;line-height:1;}
.qty-btn:disabled{opacity:.3;cursor:not-allowed;}
.qty-btn.add{background:var(--red);color:var(--cream);}
.qty-num{min-width:20px;text-align:center;font-weight:700;}
.order-summary{background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:14px;border:2px solid var(--line);}
.order-line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;}
.order-total{display:flex;justify-content:space-between;font-family:'Anton',sans-serif;font-size:20px;margin-top:8px;padding-top:8px;border-top:2px dashed var(--line);}
.charge-btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:10px;background:var(--ok);color:#fff;font-family:'Anton',sans-serif;font-size:18px;letter-spacing:.03em;cursor:pointer;}
.charge-btn:disabled{background:#999;cursor:not-allowed;}
.note-btn{width:auto;height:auto;padding:3px 8px;font-size:12px;margin-top:4px;}
.note-tag{color:var(--red);font-size:12px;font-weight:700;}
.ohne-opt{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:700;font-size:14px;}
.mgmt-item{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(38,34,32,.06);transition:border-color .15s,box-shadow .15s;}
.mgmt-item:focus-within{border-color:var(--red);box-shadow:0 2px 10px rgba(179,55,44,.15);}
.mgmt-item .info{width:100%;}
.mgmt-footer{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.mgmt-fields{display:flex;gap:10px;}
.mgmt-fields label{font-size:10px;opacity:.6;display:block;margin-bottom:2px;}
.mgmt-item input[type=number]{width:58px;padding:6px;border-radius:6px;border:2px solid var(--line);background:var(--cream);color:var(--charcoal);font-weight:700;text-align:center;}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.badge.low{background:rgba(179,55,44,.14);color:var(--red);}
.badge.paused{background:rgba(38,34,32,.14);color:var(--charcoal);}
.mgmt-actions{display:flex;gap:6px;}
.icon-btn{width:26px;height:26px;min-width:26px;border-radius:50%;border:none;display:inline-flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:transform .1s;}
.icon-btn:active{transform:scale(.88);}
.icon-btn.pause{background:var(--mustard);color:var(--charcoal);}
.icon-btn.dup{background:#3E6B8E;color:#fff;}
.icon-btn.del{background:var(--red);color:var(--cream);}
.name-input{width:100%;background:transparent;border:none;border-bottom:1px dashed var(--line);font-weight:700;font-size:15px;color:var(--charcoal);padding:3px 0 6px;margin-bottom:4px;white-space:normal;overflow-wrap:break-word;}
.name-input:focus{outline:none;border-bottom-color:var(--red);}
.desc-input{width:100%;background:transparent;border:none;border-bottom:1px dashed transparent;font-size:12px;font-style:italic;opacity:.7;color:var(--charcoal);padding:2px 0 6px;margin-bottom:6px;white-space:normal;}
.desc-input:hover,.desc-input:focus{border-bottom-color:var(--line);opacity:1;}
.desc-input:focus{outline:none;border-bottom-color:var(--red);}
.row-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.cat-select{font-size:11px;background:var(--cream);color:var(--charcoal);border:1px solid var(--line);border-radius:6px;padding:2px 4px;}
.search-wrap{position:relative;margin-bottom:18px;}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;font-size:14px;}
#menuSearch{width:100%;padding:11px 12px 11px 34px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--charcoal);font-family:'Karla',sans-serif;}
#menuSearch:focus{outline:none;border-color:var(--red);}
.add-form{display:grid;grid-template-columns:1fr 90px 90px auto;gap:8px;margin-top:16px;align-items:end;}
.add-form label{font-size:11px;font-weight:700;text-transform:uppercase;opacity:.65;display:block;margin-bottom:3px;}
.add-form input,.add-form select{width:100%;padding:8px;border-radius:6px;border:2px solid var(--line);background:var(--paper);color:var(--charcoal);}
.add-form button{padding:9px 14px;border:none;border-radius:6px;background:var(--red);color:var(--cream);font-weight:700;cursor:pointer;}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:var(--cream);padding:12px 20px;border-radius:8px;font-weight:700;opacity:0;transition:.25s;z-index:80;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.section-title{margin-bottom:14px;}
.hist-item{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.hist-head{display:flex;justify-content:space-between;align-items:baseline;}
.hist-head .table{font-family:'Anton',sans-serif;font-size:16px;}
.hist-head .total{font-weight:700;color:var(--red);}
.hist-time{font-size:11px;opacity:.6;margin-bottom:4px;}
.hist-items{font-size:12px;opacity:.75;line-height:1.5;}
</style>

<body>

<header>
  <div>
    <h1>DANNY'S DINER</h1>
    <div class="sub">Tables · Stock · Sales · v5</div>
  </div>
  <nav>
    <button id="navMesas" class="active">Tables</button>

    <div class="cat-label">Drinks</div>
    <div id="panelDrink"></div>
    <div class="order-summary">
      <div id="orderLines"></div>
      <div class="order-total"><span>Total</span><span id="orderTotal">€0</span></div>
    </div>
    <button class="charge-btn" id="chargeBtn">CHARGE TABLE</button>
  </div>
</div>

<div id="noteOverlay" class="overlay" style="z-index:70;">
  <div class="panel">
    <div class="panel-head"><h2 id="noteTitle">Ohne / Notiz</h2><button class="close-x" id="noteClose">✕</button></div>
    <div id="noteOpts" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
    <input id="noteText" placeholder="Otra nota…" style="width:100%;margin-top:12px;padding:10px;border-radius:8px;border:2px solid var(--line);background:var(--paper);color:var(--charcoal);">
    <button class="charge-btn" id="noteSave" style="background:var(--red);">OK</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<div id="errBox" style="display:none;position:fixed;top:0;left:0;right:0;background:#8C2A22;color:#fff;padding:8px 12px;font-size:12px;z-index:99;"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCUg47QDW0FHdNl2Bf7T_tCyTotwoL0x6k",
  authDomain: "dannys-2cee7.firebaseapp.com",
  databaseURL: "https://dannys-2cee7-default-rtdb.europe-west1.firebasedatabase.app",

  storageBucket: "dannys-2cee7.firebasestorage.app",
  messagingSenderId: "326553057108",
  appId: "1:326553057108:web:7aff49475fc5608a0cfac1"

let db = null, firebaseReady = false;
try{
  if(firebaseConfig.apiKey !== "PASTE_HERE"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.database().ref('dannysDinerState');
    firebaseReady = true;

}catch(e){ console.warn('Firebase not configured, using local storage only.', e); }

const STORAGE_KEY = 'dannys-diner-data-v1';
const NUM_TABLES = 8;
const MENU_VERSION = 2;
const SUB_ORDER = ['Essen','Extras','Kaffee & Heißgetränke','Softdrinks','Cocktails & Alkohol'];
const OHNE = ['Salat','Tomate','Pilze','Zwiebeln','Ei','Soße'];

function freshMenu(){

    {id:'c5', name:'Wein', category:'bebida', sub:'Cocktails & Alkohol', price:7, desc:'', stock:20},
    {id:'c6', name:'Weißwein', category:'bebida', sub:'Cocktails & Alkohol', price:7, desc:'', stock:20},
    {id:'c7', name:'Whisky', category:'bebida', sub:'Cocktails & Alkohol', price:8.5, desc:'', stock:20},
    {id:'c8', name:'Bier', category:'bebida', sub:'Cocktails & Alkohol', price:4, desc:'', stock:60},
    {id:'c9', name:'Bier vom Fass', category:'bebida', sub:'Cocktails & Alkohol', price:5, desc:'', stock:60},
  ];
}
function seed(){ return { items: freshMenu(), tables: {} }; }

function normalize(s){
  if(!s || typeof s !== 'object') return seed();
  if(!Array.isArray(s.items) || !s.items.length) s.items = seed().items;
  if(s.menuVersion !== MENU_VERSION){
    s.items = freshMenu();
    s.menuVersion = MENU_VERSION;
    s.tables = {};
    s._migrated = true;
  }
  if(!s.tables || typeof s.tables !== 'object'){
    s.tables = {};
  } else if(Array.isArray(s.tables)){
    const obj = {};
    s.tables.forEach((v,idx)=>{ if(v && Array.isArray(v) && v.length) obj['t'+idx]=v; });
    s.tables = obj;
  } else {
    const validIds = new Set(s.items.map(i=>i.id));
    Object.keys(s.tables).forEach(k=>{
      if(!s.tables[k] || !Array.isArray(s.tables[k])) { delete s.tables[k]; return; }
      s.tables[k] = s.tables[k].filter(l=>l && validIds.has(l.id));
      if(!s.tables[k].length) delete s.tables[k];
    });
  }
  if(!Array.isArray(s.salesLog)) s.salesLog = [];
  return s;
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return seed();
    return normalize(JSON.parse(raw));
  }catch(e){ return seed(); }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  if(firebaseReady && db) db.set(state);
}
function renderAll(){
  renderTables();
  if(document.getElementById('overlay').classList.contains('open')) renderPanel();
  if(document.getElementById('viewMenu').classList.contains('active')) renderMenuLists();
  if(document.getElementById('viewHistory').classList.contains('active')) renderHistory();
}

window.addEventListener('error',e=>{const b=document.getElementById('errBox'); if(b){b.style.display='block'; b.textContent='Error: '+e.message;}});
let state = load();
let activeTable = null;
if(state._migrated){ delete state._migrated; setTimeout(()=>save(), 0); }

function fmt(n){ return '€' + n.toFixed(2).replace(/\.00$/,''); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function getItem(id){ return state.items.find(i=>i.id===id); }
function tk(t){ return 't'+t; }
function tableOrder(t){ return ((state&&state.tables)||{})[tk(t)] || []; }
function tableTotal(t){
  return tableOrder(t).reduce((s,l)=>{ const it=getItem(l.id); return s + (it?it.price*l.qty:0); },0);
}
function stockRemaining(id){
  const item = getItem(id);
  let reserved = 0;
  Object.values(state.tables||{}).forEach(order=>{
    order.forEach(l=>{ if(l.id===id) reserved += l.qty; });
  });
  return item.stock - reserved;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---- Nav ----
document.getElementById('navMesas').onclick = ()=>switchView('Mesas');
document.getElementById('navHistory').onclick = ()=>switchView('History');
document.getElementById('navMenu').onclick = ()=>switchView('Menu');
function switchView(v){
  ['Mesas','History','Menu'].forEach(n=>{
    document.getElementById('view'+n).classList.toggle('active', v===n);
    document.getElementById('nav'+n).classList.toggle('active', v===n);
  });
  if(v==='Menu') renderMenuLists();
  if(v==='History') renderHistory();
}

// ---- Tables grid ----
function renderTables(){
  const grid = document.getElementById('tablesGrid');
  grid.innerHTML = '';
  for(let i=1;i<=NUM_TABLES;i++){
    const order = tableOrder(i);
    const total = tableTotal(i);
    const div = document.createElement('div');
    div.className = 'table-card' + (order.length?' occupied':'');
    div.innerHTML = `<div class="num">Table ${i}</div>` +
      (order.length ? `<div class="amt">${fmt(total)}</div>` : `<div class="empty">Free</div>`);
    div.onclick = ()=>openTable(i);
    grid.appendChild(div);
  }
}

// ---- Order panel ----
function openTable(t){
  activeTable = t;
  document.getElementById('panelTitle').textContent = 'Table ' + t;
  renderPanel();
  document.getElementById('overlay').classList.add('open');
}
document.getElementById('closePanel').onclick = ()=>{
  document.getElementById('overlay').classList.remove('open');
  renderTables();
};
function renderPanel(){
  renderPanelCat('comida', document.getElementById('panelFood'));
  renderPanelCat('bebida', document.getElementById('panelDrink'));
  renderOrderSummary();
}
function panelRowHtml(item){
  const qty = tableOrder(activeTable).filter(l=>l.id===item.id).reduce((s,l)=>s+l.qty,0);
  const avail = stockRemaining(item.id);
  return `
    <div class="item-row">
      <div class="info"><div class="name">${item.name}</div><div class="meta">${fmt(item.price)}${item.desc?' · '+item.desc:''} · ${avail + qty} left</div></div>
      <button class="qty-btn" ${qty===0?'disabled':''} data-act="minus" data-id="${item.id}">−</button>
      <div class="qty-num">${qty}</div>
      <button class="qty-btn add" ${avail<=0?'disabled':''} data-act="plus" data-id="${item.id}">+</button>
    </div>
  `;
}
function renderPanelCat(cat, container){
  container.innerHTML = '';
  const items = state.items.filter(i=>i.category===cat && i.available!==false);
  const groups = {};
  items.forEach(i=>{ const g = SUB_ORDER.includes(i.sub) ? i.sub : 'Other'; (groups[g]=groups[g]||[]).push(i); });
  [...SUB_ORDER,'Other'].forEach(g=>{
    if(!groups[g] || !groups[g].length) return;
    container.innerHTML += `<div class="cat-label">${g}</div>`;
    groups[g].sort((a,b)=>a.name.localeCompare(b.name)).forEach(item=>{ container.innerHTML += panelRowHtml(item); });
  });
}
document.getElementById('panelFood').addEventListener('click', handleQtyClick);
document.getElementById('panelDrink').addEventListener('click', handleQtyClick);
function handleQtyClick(e){
  const btn = e.target.closest('.qty-btn');
  if(!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  if(!state.tables[tk(activeTable)]) state.tables[tk(activeTable)] = [];
  const order = state.tables[tk(activeTable)];
  let line = order.find(l=>l.id===id && !l.note);
  if(act==='plus'){
    if(stockRemaining(id) <= 0) return;
    if(line) line.qty++; else order.push({id, qty:1, note:''});
  } else {
    if(!line) line = [...order].reverse().find(l=>l.id===id);
    if(line){ line.qty--; if(line.qty<=0) state.tables[tk(activeTable)] = order.filter(l=>l!==line); }
  }
  save();
  renderPanel();
}

function renderOrderSummary(){
  const order = tableOrder(activeTable);
  const linesDiv = document.getElementById('orderLines');
  linesDiv.innerHTML = order.length ? '' : '<div style="opacity:.55; font-size:13px;">No items yet</div>';
  order.forEach((l,idx)=>{
    const it = getItem(l.id);
    const row = document.createElement('div');
    row.className = 'order-line';
    row.innerHTML = `<span>${l.qty}× ${it.name}${l.note?`<br><span class="note-tag">${esc(l.note)}</span>`:''}<br><button class="qty-btn note-btn" data-idx="${idx}">ohne / Notiz</button></span><span>${fmt(it.price*l.qty)}</span>`;
    linesDiv.appendChild(row);
  });
  document.getElementById('orderTotal').textContent = fmt(tableTotal(activeTable));
  document.getElementById('chargeBtn').disabled = order.length===0;
}

// ---- Ohne / Notiz ----
let noteIdx = null;
document.getElementById('orderLines').addEventListener('click', e=>{
  const b = e.target.closest('.note-btn'); if(!b) return;
  noteIdx = +b.dataset.idx;
  const line = tableOrder(activeTable)[noteIdx]; if(!line) return;
  const parts = (line.note||'').split(', ').filter(Boolean);
  document.getElementById('noteTitle').textContent = getItem(line.id).name;
  document.getElementById('noteOpts').innerHTML = OHNE.map(o=>
    `<label class="ohne-opt"><input type="checkbox" value="ohne ${o}" ${parts.includes('ohne '+o)?'checked':''}> ohne ${o}</label>`).join('');
  document.getElementById('noteText').value = parts.filter(p=>!(p.startsWith('ohne ') && OHNE.includes(p.slice(5)))).join(', ');
  document.getElementById('noteOverlay').classList.add('open');
});
document.getElementById('noteClose').onclick = ()=>document.getElementById('noteOverlay').classList.remove('open');
document.getElementById('noteSave').onclick = ()=>{
  const order = state.tables[tk(activeTable)];
  const line = order && order[noteIdx]; if(!line) return;
  const picked = [...document.querySelectorAll('#noteOpts input:checked')].map(i=>i.value);
  const extra = document.getElementById('noteText').value.trim();
  const note = [...picked, ...(extra?[extra]:[])].join(', ');
  if(line.qty>1 && note!==(line.note||'')){
    line.qty--;
    const same = order.find(l=>l!==line && l.id===line.id && (l.note||'')===note);
    if(same) same.qty++; else order.push({id:line.id, qty:1, note});
  } else { line.note = note; }
  save();
  document.getElementById('noteOverlay').classList.remove('open');
  renderPanel();
};

document.getElementById('chargeBtn').onclick = ()=>{
  const order = tableOrder(activeTable);
  if(!order.length) return;
  const total = tableTotal(activeTable);
  const itemsSnapshot = order.map(l=>({name:getItem(l.id).name, qty:l.qty, price:getItem(l.id).price, note:l.note||''}));
  order.forEach(l=>{
    const it = getItem(l.id);
    it.stock = Math.max(0, it.stock - l.qty);
  });
  delete state.tables[tk(activeTable)];
  if(!state.salesLog) state.salesLog = [];
  state.salesLog.unshift({id: Date.now()+'-'+activeTable, table: activeTable, total, items: itemsSnapshot, closedAt: new Date().toISOString()});
  save();
  document.getElementById('overlay').classList.remove('open');
  renderTables();
  toast('Table ' + activeTable + ' charged — ' + fmt(total));
};

function renderHistory(){
  const log = state.salesLog || [];
  const listEl = document.getElementById('historyList');
  const totalEl = document.getElementById('historyTotal');
  if(!log.length){
    listEl.innerHTML = '<div style="opacity:.55; font-size:13px;">No closed tables yet</div>';
    totalEl.textContent = '';
    return;
  }
  const sum = log.reduce((s,e)=>s+e.total,0);
  totalEl.textContent = 'Total recorded: ' + fmt(sum) + ' · ' + log.length + ' table(s)';
  listEl.innerHTML = '';
  log.forEach(e=>{
    const d = new Date(e.closedAt);
    const timeStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    const itemsStr = e.items.map(i=>`${i.qty}× ${esc(i.name)}${i.note?' ('+esc(i.note)+')':''}`).join(', ');
    const div = document.createElement('div');
    div.className = 'hist-item';
    div.innerHTML = `
      <div class="hist-time">${timeStr}</div>
      <div class="hist-head"><span class="table">Table ${e.table}</span><span class="total">${fmt(e.total)}</span></div>
      <div class="hist-items">${itemsStr}</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="qty-btn hist-edit" data-id="${e.id}" style="width:auto; padding:4px 10px; font-size:12px;">Edit</button>
        <button class="qty-btn hist-del" data-id="${e.id}" style="width:auto; padding:4px 10px; font-size:12px; border-color:var(--red); color:var(--red);">Delete</button>
      </div>
    `;
    listEl.appendChild(div);
  });
}
document.getElementById('historyList').addEventListener('click', e=>{
  const delBtn = e.target.closest('.hist-del');
  const editBtn = e.target.closest('.hist-edit');
  if(delBtn){
    if(!confirm('Delete this closed-table entry?')) return;
    state.salesLog = (state.salesLog||[]).filter(x=>x.id!==delBtn.dataset.id);
    save(); renderHistory();
  } else if(editBtn){
    const entry = (state.salesLog||[]).find(x=>x.id===editBtn.dataset.id);
    if(!entry) return;
    const val = prompt('New total for Table ' + entry.table + ' (€):', entry.total);
    if(val===null) return;
    const num = parseFloat(val.replace(',','.'));
    if(isNaN(num)) return;
    entry.total = num;
    save(); renderHistory();
  }
});

// ---- Menu & stock management ----
function renderMenuLists(){
  renderMgmt('comida', document.getElementById('foodList'));
  renderMgmt('bebida', document.getElementById('drinkList'));
}
function mgmtRowHtml(item){
  const low = item.stock <= 3;
  const paused = item.available === false;
  return `
    <div class="mgmt-item" style="${paused?'opacity:.55;':''}">
      <div class="info">
        <input class="name-input nameInput" data-id="${item.id}" value="${esc(item.name)}" placeholder="Product name">
        <input class="desc-input descInput" data-id="${item.id}" value="${esc(item.desc||'')}" placeholder="Description / ingredients">
        <div class="row-meta">
          <select class="cat-select catSelect" data-id="${item.id}">
            <option value="comida" ${item.category==='comida'?'selected':''}>Food</option>
            <option value="bebida" ${item.category==='bebida'?'selected':''}>Drink</option>
          </select>
          <select class="cat-select subSelect" data-id="${item.id}">
            ${SUB_ORDER.map(g=>`<option value="${g}" ${item.sub===g?'selected':''}>${g}</option>`).join('')}
          </select>
          ${low?'<span class="badge low">Low stock</span>':''}
          ${paused?'<span class="badge paused">Paused</span>':''}
        </div>
      </div>
      <div class="mgmt-footer">
        <div class="mgmt-fields">
          <div><label>Price €</label><input type="number" min="0" step="0.5" value="${item.price}" data-id="${item.id}" class="priceInput"></div>
          <div><label>Stock</label><input type="number" min="0" value="${item.stock}" data-id="${item.id}" class="stockInput"></div>
        </div>
        <div class="mgmt-actions">
          <button class="icon-btn pause pauseBtn" data-id="${item.id}" title="${paused?'Resume':'Pause'}">${paused?'▶':'⏸'}</button>
          <button class="icon-btn dup dupBtn" data-id="${item.id}" title="Duplicate">⧉</button>
          <button class="icon-btn del" data-id="${item.id}" title="Delete">🗑</button>
        </div>
      </div>
    </div>
  `;
}
function renderMgmt(cat, container){
  const q = (document.getElementById('menuSearch').value||'').toLowerCase().trim();
  let items = state.items.filter(i=>i.category===cat && i.name.toLowerCase().includes(q));
  container.innerHTML = '';
  const groups = {};
  items.forEach(i=>{ const g = SUB_ORDER.includes(i.sub) ? i.sub : 'Other'; (groups[g]=groups[g]||[]).push(i); });
  [...SUB_ORDER,'Other'].forEach(g=>{
    if(!groups[g] || !groups[g].length) return;
    container.innerHTML += `<div class="cat-label">${g}</div>`;
    groups[g].sort((a,b)=>a.name.localeCompare(b.name)).forEach(item=>{ container.innerHTML += mgmtRowHtml(item); });
  });
}
document.getElementById('menuSearch').addEventListener('input', renderMenuLists);
document.getElementById('foodList').addEventListener('input', handleMgmtInput);
document.getElementById('drinkList').addEventListener('input', handleMgmtInput);
function handleMgmtInput(e){
  const id = e.target.dataset.id; if(!id) return;
  const it = getItem(id); if(!it) return;
  if(e.target.classList.contains('stockInput')){ it.stock = Math.max(0, parseInt(e.target.value)||0); save(); }
  else if(e.target.classList.contains('priceInput')){ const v=parseFloat(e.target.value); it.price = isNaN(v)?0:Math.max(0,v); save(); }
  else if(e.target.classList.contains('nameInput')){ it.name = e.target.value; save(); }
  else if(e.target.classList.contains('descInput')){ it.desc = e.target.value; save(); }
  else if(e.target.classList.contains('catSelect')){ it.category = e.target.value; save(); renderMenuLists(); }
  else if(e.target.classList.contains('subSelect')){ it.sub = e.target.value; save(); renderMenuLists(); }
}
document.getElementById('foodList').addEventListener('click', handleMgmtClick);
document.getElementById('drinkList').addEventListener('click', handleMgmtClick);
function handleMgmtClick(e){
  const pauseBtn = e.target.closest('.pauseBtn');
  const dupBtn = e.target.closest('.dupBtn');
  const delBtn = e.target.closest('.icon-btn.del');
  if(pauseBtn){
    const it = getItem(pauseBtn.dataset.id);
    it.available = it.available === false ? true : false;
    save(); renderMenuLists();
  } else if(dupBtn){
    const it = getItem(dupBtn.dataset.id);
    const newId = it.category[0]+Date.now();
    const copy = Object.assign({}, it, {id: newId, name: it.name + ' (copy)'});
    state.items.push(copy);
    save(); renderMenuLists();
    const input = document.querySelector(`.nameInput[data-id="${newId}"]`);
    if(input){ input.scrollIntoView({behavior:'smooth', block:'center'}); input.focus(); input.select(); }
  } else if(delBtn){
    state.items = state.items.filter(i=>i.id!==delBtn.dataset.id);
    Object.keys(state.tables).forEach(t=>{
      state.tables[t] = (state.tables[t]||[]).filter(l=>l.id!==delBtn.dataset.id);
      if(!state.tables[t].length) delete state.tables[t];
    });
    save(); renderMenuLists();
  }
}

document.getElementById('addItemBtn').onclick = ()=>{
  const name = document.getElementById('newName').value.trim();
  const price = parseFloat(document.getElementById('newPrice').value);
  const stock = parseInt(document.getElementById('newStock').value)||0;
  const cat = document.getElementById('newCat').value;
  if(!name || isNaN(price)){ toast('Fill in name and price'); return; }
  const id = cat[0] + Date.now();
  state.items.push({id, name, category:cat, price, stock});
  save();
  document.getElementById('newName').value='';
  document.getElementById('newPrice').value='';
  document.getElementById('newStock').value='0';
  renderMenuLists();
  toast('Product added');
};

renderTables();
if(firebaseReady && db){
  db.on('value', snap=>{
    try{
      const remote = snap.val();
      if(remote){
        state = normalize(remote);
        if(state._migrated){ delete state._migrated; save(); }
      } else { db.set(state); }
      renderAll();
    }catch(e){ console.error('Sync error, keeping last good view.', e); }
  });
}
</script>
